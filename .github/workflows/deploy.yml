# Builds the site and publishes it to GitHub Pages on pushes to main.
# Edits saved from the site (ratings, watchlist, logged watches) don't need a deploy: the
# live site reads those files straight from the repo (see USER_DATA in src/data.ts), so
# pushes that only touch them are skipped. A push that also changes anything else deploys.
name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/ratings.json'
      - 'data/ratings-history.jsonl'
      - 'data/watchlist.json'
      - 'data/watchlist-history.jsonl'
      - 'data/watchlist-movies.json'
      - 'data/watches.json'
      - 'data/watches-history.jsonl'
      - 'data/logged-movies.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A running deploy always finishes; newer pushes queue behind it (GitHub keeps only the
# latest waiting run), so frequent saves from the site can't keep cancelling every deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
